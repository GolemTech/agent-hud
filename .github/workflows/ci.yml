name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job writes to the repository.
permissions:
  contents: read

jobs:
  test:
    name: Tests and plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Pinned version; tests and validate need no account or API key.
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - run: claude plugin test .
      - run: claude plugin validate .

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # scan the full history, not only the last commit
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git . --no-banner --redact --exit-code 1

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.180.0
      - run: >-
          semgrep scan --metrics=off --error
          --config p/typescript --config p/javascript --config p/secrets
          --config p/security-audit --config p/owasp-top-ten
          hooks/
